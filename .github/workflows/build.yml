name: Build Release Executable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            upx \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: pip install maturin "nuitka[onefile]" numpy matplotlib scipy pyqt6

      - name: Build and install Rust extension
        run: maturin develop --release

      - name: Verify extension is importable
        run: python -c "import fastsegy; print('fastsegy OK')"

      - name: Build executable
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=pyqt6 \
            --include-package=fastsegy \
            --lto=yes \
            --static-libpython=yes \
            --python-flag=no_site,no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --include-qt-plugins=sensible \
            --output-filename=segy-reader \
            python/fastsegy/gui/app.py

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: segy-reader
