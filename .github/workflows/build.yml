name: Build Release Executable

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            output: segy-reader
          - os: windows-latest
            output: segy-reader.exe

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxkbcommon0

      - name: Install Python dependencies
        run: pip install maturin "nuitka[onefile]" numpy matplotlib scipy pyqt6

      - name: Build and install Rust extension
        run: |
          maturin build --release
          pip install --find-links target/wheels fastsegy

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=pyqt6 \
            --include-package=fastsegy \
            --lto=yes \
            --static-libpython=yes \
            --python-flag=no_site,no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --include-qt-plugins=sensible \
            --output-filename=segy-reader \
            python/fastsegy/gui/app.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        env:
          NUITKA_DOWNLOAD_DEPENDENCY_WALKER: yes
        run: |
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --enable-plugin=pyqt6 `
            --include-package=fastsegy `
            --lto=yes `
            --python-flag=no_site,no_docstrings `
            --noinclude-pytest-mode=nofollow `
            --noinclude-setuptools-mode=nofollow `
            --noinclude-unittest-mode=nofollow `
            --include-qt-plugins=sensible `
            --output-filename=segy-reader `
            python/fastsegy/gui/app.py

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output }}
