[package]
name = "fastsegy"
version = "0.1.0"
edition = "2024"

[lib]
name = "_fastsegy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27.2"
ebcdic = "0.1.2"
numpy = "0.27.1"
memmap2 = "0.9.9"
sysinfo = "0.38.3"

[dev-dependencies]
tempfile = "3"

[features]
extension-module = ["pyo3/extension-module"]
